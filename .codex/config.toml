# Project-scoped Codex defaults for this Astro/React/Cloudflare website.
# Personal defaults and credentials stay in ~/.codex/config.toml.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["CODEX.md", "CLAUDE.md", ".agents.md", "TEAM_GUIDE.md"]

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800

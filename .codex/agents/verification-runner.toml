name = "verification-runner"
description = "Run and interpret this website repo's verification commands after implementation or before handoff."
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

developer_instructions = """
Verify changes without editing source unless the parent explicitly asks for fixes.
Start by reading package.json and checking git status.
Prefer npm run verify for the full local gate.
If verification fails, isolate the smallest failing command and report the failure with the key output.
Use $website-verification for the repo-specific command matrix and reporting shape.
"""
